<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screensaver Preview</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
    #stage { position: fixed; inset: 0; }
    #screensaver-canvas { width: 100%; height: 100%; display: block; }

    /* Videowall emulation: the canvas keeps its real target resolution (e.g.
       6000x1200) as its backing-store size, and is scaled down purely for
       display. Screensavers therefore see the true pixel dimensions and
       aspect ratio, which is what we are trying to test. */
    body.wall #stage {
      inset: auto; top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(var(--wall-scale));
      transform-origin: center center;
      width: var(--wall-w); height: var(--wall-h);
      outline: 1px solid #0066ff;
    }
    body.wall #screensaver-canvas { width: var(--wall-w); height: var(--wall-h); }

    /* Simulates ambient light washing out a projector screen. Overlaying grey
       raises the black floor the way stray light does, so particles that are
       invisible on the real wall are also invisible here. */
    #washout {
      position: fixed; inset: 0; z-index: 5; pointer-events: none;
      background: #808080; opacity: 0; mix-blend-mode: screen;
    }
    #hud {
      position: fixed; top: 16px; left: 16px; z-index: 10;
      font-family: monospace; color: #fff; background: rgba(0,0,0,0.55);
      border: 1px solid #0066ff; border-radius: 8px; padding: 10px 14px;
      font-size: 13px; line-height: 1.6; user-select: none;
    }
    #hud h1 { font-size: 13px; color: #4d9bff; margin-bottom: 6px; letter-spacing: 1px; }
    #hud .list button {
      display: block; width: 100%; text-align: left; background: none; border: none;
      color: #ccc; font: inherit; cursor: pointer; padding: 2px 4px; border-radius: 4px;
    }
    #hud .list button.active { background: #0066ff; color: #fff; }
    #hud .list button:hover { color: #fff; }
    #hud .keys { margin-top: 8px; color: #888; font-size: 11px; }
    #hud.hidden { display: none; }
    #fps { position: fixed; top: 16px; right: 16px; z-index: 10;
      font-family: monospace; color: #6bff95; background: rgba(0,0,0,0.55);
      padding: 6px 10px; border-radius: 6px; font-size: 12px; }
    #mode { position: fixed; bottom: 16px; right: 16px; z-index: 10;
      font-family: monospace; color: #ffd166; background: rgba(0,0,0,0.55);
      padding: 6px 10px; border-radius: 6px; font-size: 12px; }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="screensaver-canvas"></canvas>
  </div>
  <div id="washout"></div>
  <div id="hud">
    <h1>SCREENSAVER PREVIEW</h1>
    <div class="list" id="list"></div>
    <div class="keys">←/→ cycle · R restart · S new seed · H hide HUD · F fullscreen<br>
      W videowall 6000×1200 · L washout (ambient light) · A weather state<br>
      [ / ] bloom threshold · − / + bloom intensity · 0 reset</div>
  </div>
  <div id="fps">– fps</div>
  <div id="mode">–</div>
  <script type="module" src="./preview.js"></script>
</body>
</html>
